name: Auto-fix npm vulnerabilities

on:
  schedule:
    - cron: '0 9 * * 1'    # Every Monday at 9am UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  audit:
    name: Check for vulnerabilities
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.audit.outputs.has_vulnerabilities }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        id: audit
        run: |
          AUDIT_JSON=$(npm audit --json) || true
          if ! echo "$AUDIT_JSON" | jq -e . > /dev/null 2>&1; then
            echo "npm audit did not produce valid JSON — possible registry/network error."
            exit 1
          fi
          if echo "$AUDIT_JSON" | jq -e '.vulnerabilities | length > 0' > /dev/null 2>&1; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "Vulnerabilities found."
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "No vulnerabilities found."
          fi

  fix:
    name: Fix vulnerabilities with Claude
    needs: audit
    if: needs.audit.outputs.has_vulnerabilities == 'true' && vars.ENABLE_AUTO_VULN_FIX == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code to fix vulnerabilities
        uses: anthropics/claude-code-action@567fe954a4527e81f132d87d1bdbcc94f7737434 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: fix/npm-vuln-
          branch_name_template: '{{prefix}}{{timestamp}}-{{sha}}'
          prompt: |
            REPO: ${{ github.repository }}
            WORKFLOW RUN: ${{ github.run_id }}

            Goal: fully resolve npm dependency vulnerabilities with proper upgrades. Do not change application source code (only dependency/manifest files such as package.json, package-lock.json, and npm-related config if required).

            Follow this procedure:
            1. Run `npm audit --json` and inspect results. If there are no vulnerabilities, stop (nothing to commit).
            2. Run `npm audit fix` (do not use `--force` yet).
            3. Re-run `npm audit --json`. For any remaining issues, upgrade dependencies with `npm install <package>@<version>` as needed. Prefer patch/minor; use major upgrades only when required to clear a vulnerability.
            4. Repeat audit and targeted installs until no fixable vulnerabilities remain without `--force`.
            5. If issues remain with no patched version, document that in the PR body and stop without `audit fix --force` unless unavoidable.
            6. Run `npm dedupe`.
            7. Run tests with `npm test` if the test script exists; if tests fail, revert breaking changes or stop and report — do not open a PR that leaves the suite failing.
            8. Final check: `npm audit` should show zero fixable vulnerabilities where possible.

            When you have meaningful lockfile or package.json changes:
            - Commit with message: `Resolve npm audit vulnerabilities` (imperative, no Conventional Commits prefix — match this repo's history)
            - Push the branch and open a pull request to the default branch using `gh pr create`.
            - PR title: `Resolve npm audit vulnerabilities` (same style as the commit message unless the change is clearly a version bump, then prefer a title like `Bump dependencies to resolve npm audit`)
            - PR body must mention this was generated by the fix-npm-vulnerabilities workflow, list what you ran (audit fix, specific upgrades, dedupe, tests), and ask reviewers to verify package.json / package-lock.json.

            Constraints: avoid `npm audit fix --force` unless strictly necessary and explain why in the PR body. Do not add ignore rules or temporary hacks to hide vulnerabilities.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Bash(npm:*),Bash(npx:*),Bash(git:*),Bash(gh:*)"
