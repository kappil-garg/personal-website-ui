name: Auto-fix npm vulnerabilities

on:
  schedule:
    - cron: '0 9 * * 1'    # Every Monday at 9am UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  audit:
    name: Check for vulnerabilities
    runs-on: ubuntu-latest
    outputs:
      has_vulnerabilities: ${{ steps.audit.outputs.has_vulnerabilities }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        id: audit
        run: |
          if npm audit --json | jq -e '.vulnerabilities | length > 0' > /dev/null 2>&1; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "Vulnerabilities found."
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "No vulnerabilities found."
          fi

  fix:
    name: Fix vulnerabilities with Claude
    needs: audit
    if: needs.audit.outputs.has_vulnerabilities == 'true' && vars.ENABLE_AUTO_VULN_FIX == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate branch name
        id: branch
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "name=fix/npm-vuln-${DATE}" >> $GITHUB_OUTPUT

      - name: Run Claude Code to fix vulnerabilities
        uses: anthropics/claude-code-action@beta
        with:
          prompt: "/fix-npm-vulnerabilities"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_name: ${{ steps.branch.outputs.name }}
          commit_message: "fix: resolve npm audit vulnerabilities"
          pr_title: "Resolve npm audit vulnerabilities (${{ steps.branch.outputs.name }})"
          pr_body: |
            This PR was automatically generated by the `fix-npm-vulnerabilities` workflow.

            Changes made:
            - Ran `npm audit fix` to resolve safe upgrades
            - Applied manual package upgrades for remaining vulnerabilities
            - Ran `npm dedupe` to clean up the dependency tree

            Please review the `package.json` and `package-lock.json` changes before merging.
